<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khung Chat Trực Tuyến</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-box {
            height: 400px;
            overflow-y: auto;
            background-color: #f8f9fa;
        }
        .msg-bubble {
            max-width: 75%;
            border-radius: 15px;
            padding: 8px 14px;
            margin-bottom: 8px;
            word-wrap: break-word;
        }
        .msg-me {
            background-color: #0d6efd;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .msg-other {
            background-color: #e9ecef;
            color: #212529;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-4" style="max-width: 600px;">
    <div class="card shadow border-0 rounded-3">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
            <h5 class="mb-0 fw-bold">💬 Phòn Chat Trực Tuyến</h5>
            <a href="/" class="btn btn-sm btn-outline-light">Trang chủ</a>
        </div>
        
        <!-- Ô HIỂN THỊ TIN NHẮN -->
        <div class="card-body p-3 chat-box d-flex flex-column" id="chatBox">
            {% for msg in messages_list %}
                <div class="msg-bubble {% if msg.user == request.user %}msg-me{% else %}msg-other{% endif %}">
                    <small class="fw-bold d-block text-opacity-75 {% if msg.user == request.user %}text-white{% else %}text-muted{% endif %}" style="font-size: 0.75rem;">
                        {{ msg.user.username }} • {{ msg.timestamp|date:"H:i" }}
                    </small>
                    {{ msg.message }}
                </div>
            {% endfor %}
        </div>

        <!-- Ô NHẬP TIN NHẮN -->
        <div class="card-footer bg-white p-3">
            <form id="chatForm" class="d-flex gap-2">
                {% csrf_token %}
                <input type="text" id="messageInput" class="form-control" placeholder="Nhập tin nhắn..." autocomplete="off" required>
                <button type="submit" class="btn btn-primary fw-bold">Gửi</button>
            </form>
        </div>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const currentUser = "{{ request.user.username }}";

    // Cuộn xuống cuối khung chat
    function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }
    scrollToBottom();

    // Gửi tin nhắn bằng AJAX
    chatForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const message = messageInput.value.trim();
        if (!message) return;

        const formData = new FormData();
        formData.append('message', message);
        formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

        fetch("{% url 'send_message' %}", {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'ok') {
                messageInput.value = '';
                loadMessages();
            }
        });
    });

    // Tải lại tin nhắn mới
    function loadMessages() {
        fetch("{% url 'get_messages' %}")
        .then(res => res.json())
        .then(data => {
            chatBox.innerHTML = '';
            data.messages.forEach(msg => {
                const isMe = msg.user === currentUser;
                const bubble = document.createElement('div');
                bubble.className = `msg-bubble ${isMe ? 'msg-me' : 'msg-other'}`;
                bubble.innerHTML = `
                    <small class="fw-bold d-block ${isMe ? 'text-white' : 'text-muted'}" style="font-size: 0.75rem;">
                        ${msg.user} • ${msg.timestamp}
                    </small>
                    ${msg.message}
                `;
                chatBox.appendChild(bubble);
            });
            scrollToBottom();
        });
    }

    // Tự động làm mới tin nhắn mỗi 3 giây
    setInterval(loadMessages, 3000);
</script>

</body>
</html>
