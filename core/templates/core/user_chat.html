<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hỗ Trợ Trực Tuyến</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-box { height: 400px; overflow-y: auto; background-color: #f8f9fa; }
        .msg-bubble { max-width: 75%; border-radius: 12px; padding: 8px 14px; margin-bottom: 8px; }
        .msg-me { background-color: #0d6efd; color: white; align-self: flex-end; }
        .msg-other { background-color: #e9ecef; color: #212529; align-self: flex-start; }
    </style>
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 600px;">
    <div class="card shadow border-0 rounded-3">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
            <h5 class="mb-0 fw-bold">💬 Chat Với Admin / Hỗ Trợ</h5>
            <a href="/" class="btn btn-sm btn-outline-light">Trang chủ</a>
        </div>
        
        <div class="card-body p-3 chat-box d-flex flex-column" id="chatBox">
            {% for msg in messages_list %}
                <div class="msg-bubble {% if msg.sender == request.user %}msg-me{% else %}msg-other{% endif %}">
                    <small class="fw-bold d-block {% if msg.sender == request.user %}text-white-50{% else %}text-muted{% endif %}" style="font-size: 0.75rem;">
                        {{ msg.sender.username }} • {{ msg.timestamp|date:"H:i" }}
                    </small>
                    {{ msg.message }}
                </div>
            {% endfor %}
        </div>

        <div class="card-footer bg-white p-3">
            <form id="chatForm" class="d-flex gap-2">
                {% csrf_token %}
                <input type="hidden" id="receiverId" value="{{ admin_user.id }}">
                <input type="text" id="messageInput" class="form-control" placeholder="Nhập tin nhắn cho Admin..." required>
                <button type="submit" class="btn btn-primary fw-bold">Gửi</button>
            </form>
        </div>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const adminId = "{{ admin_user.id }}";

    function scrollToBottom() { chatBox.scrollTop = chatBox.scrollHeight; }
    scrollToBottom();

    document.getElementById('chatForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const message = document.getElementById('messageInput').value.trim();
        if (!message || !adminId) return;

        const formData = new FormData();
        formData.append('message', message);
        formData.append('receiver_id', adminId);
        formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

        fetch("{% url 'send_message' %}", { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'ok') {
                document.getElementById('messageInput').value = '';
                loadMessages();
            }
        });
    });

    function loadMessages() {
        if (!adminId) return;
        fetch("{% url 'get_messages' %}?partner_id=" + adminId)
        .then(res => res.json())
        .then(data => {
            chatBox.innerHTML = '';
            data.messages.forEach(msg => {
                const bubble = document.createElement('div');
                bubble.className = `msg-bubble ${msg.is_me ? 'msg-me' : 'msg-other'}`;
                bubble.innerHTML = `<small class="fw-bold d-block ${msg.is_me ? 'text-white-50' : 'text-muted'}" style="font-size: 0.75rem;">${msg.sender} • ${msg.timestamp}</small>${msg.message}`;
                chatBox.appendChild(bubble);
            });
            scrollToBottom();
        });
    }
    setInterval(loadMessages, 3000);
</script>
</body>
</html>
